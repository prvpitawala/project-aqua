<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Sign In - AquaStore</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --aqua-50: #ecfeff;
            --aqua-100: #cffafe;
            --aqua-200: #a5f3fc;
            --aqua-400: #22d3ee;
            --aqua-500: #06b6d4;
            --aqua-600: #0891b2;
            --aqua-700: #0e7490;
            --aqua-800: #155e75;
            --slate-800: #1e293b;
            --slate-600: #475569;
        }
        body {
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0c4a6e 0%, #06b6d4 50%, #22d3ee 100%);
            background-attachment: fixed;
            padding: 2rem;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(circle at 20% 80%, rgba(34, 211, 238, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(8, 145, 178, 0.2) 0%, transparent 50%);
            pointer-events: none;
        }
        .signin-wrapper {
            position: relative;
            z-index: 1;
        }
        .signin-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            padding: 2.75rem;
            border-radius: 24px;
            box-shadow: 
                0 25px 50px -12px rgba(0, 0, 0, 0.25),
                0 0 0 1px rgba(255, 255, 255, 0.5);
            width: 100%;
            max-width: 400px;
            animation: cardEnter 0.5s ease-out;
        }
        @keyframes cardEnter {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        .logo-icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 1rem;
            background: linear-gradient(135deg, var(--aqua-500), var(--aqua-400));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
        }
        .logo h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--slate-800);
            letter-spacing: -0.02em;
        }
        .logo p {
            font-size: 0.95rem;
            color: var(--slate-600);
            margin-top: 0.25rem;
            font-weight: 500;
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--slate-800);
            font-size: 0.9rem;
        }
        .form-group input {
            width: 100%;
            padding: 0.875rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-group input:hover {
            border-color: #cbd5e1;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--aqua-500);
            box-shadow: 0 0 0 4px rgba(6, 182, 212, 0.15);
        }
        .form-group input::placeholder {
            color: #94a3b8;
        }
        .password-field {
            position: relative;
        }
        .password-field input {
            padding-right: 3rem;
        }
        .password-toggle {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2rem;
            height: 2rem;
            padding: 0;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: var(--slate-600);
            cursor: pointer;
            transition: color 0.2s, background 0.2s;
        }
        .password-toggle:hover {
            color: var(--aqua-600);
            background: rgba(6, 182, 212, 0.08);
        }
        .password-toggle svg {
            width: 1.25rem;
            height: 1.25rem;
        }
        .password-toggle .icon-hide {
            display: none;
        }
        .password-toggle.is-visible .icon-show {
            display: none;
        }
        .password-toggle.is-visible .icon-hide {
            display: block;
        }
        .form-actions {
            display: flex;
            gap: 0.75rem;
            margin-top: 1.75rem;
        }
        .form-actions button, .form-actions a {
            flex: 1;
            padding: 0.875rem 1.25rem;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            text-align: center;
            text-decoration: none;
            font-family: inherit;
            transition: all 0.2s;
        }
        .btn-signin {
            background: linear-gradient(135deg, var(--aqua-600), var(--aqua-500));
            color: white;
            box-shadow: 0 4px 14px rgba(6, 182, 212, 0.4);
        }
        .btn-signin:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(6, 182, 212, 0.5);
        }
        .btn-signin:active {
            transform: translateY(0);
        }
        .btn-cancel {
            background: #f1f5f9;
            color: var(--slate-600);
        }
        .btn-cancel:hover {
            background: #e2e8f0;
            color: var(--slate-800);
        }
        .error-msg {
            color: #991b1b;
            font-size: 0.9rem;
            margin-top: 0.5rem;
            padding: 0.5rem 0.75rem;
            background: #fef2f2;
            border-radius: 8px;
            display: none;
        }
        .alert-dismissible {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 0.75rem;
        }
        .alert-banner-text { flex: 1; min-width: 0; }
        .alert-banner-close {
            flex-shrink: 0;
            border: none;
            background: transparent;
            color: inherit;
            opacity: 0.65;
            font-size: 1.25rem;
            line-height: 1;
            cursor: pointer;
            padding: 0 0.1rem;
            margin: -0.05rem 0 0;
        }
        .alert-banner-close:hover { opacity: 1; }
        .back-link {
            margin-top: 1.5rem;
            text-align: center;
        }
        .back-link a {
            color: var(--slate-600);
            font-size: 0.9rem;
            font-weight: 500;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            transition: color 0.2s;
        }
        .back-link a:hover {
            color: var(--aqua-600);
        }
    </style>
</head>
<body>
    <div class="signin-wrapper">
        <div class="signin-card">
            <div class="logo">
                <div class="logo-icon">◈</div>
                <h1>AquaStore</h1>
                <p>Admin Sign In</p>
            </div>
            <form id="adminLoginForm" onsubmit="submitAdminLogin(event)">
                <div class="form-group">
                    <label for="adminUser">Username</label>
                    <input type="text" id="adminUser" name="username" placeholder="Enter your username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="adminPass">Password</label>
                    <div class="password-field">
                        <input type="password" id="adminPass" name="password" placeholder="Enter your password" required autocomplete="current-password">
                        <button type="button" class="password-toggle" id="adminPassToggle" aria-label="Show password" aria-pressed="false">
                            <svg class="icon-show" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg class="icon-hide" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M1 1l22 22"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/></svg>
                        </button>
                    </div>
                </div>
                <div id="loginError" class="error-msg alert-dismissible" role="alert" style="display:none">
                    <span class="alert-banner-text"></span>
                    <button type="button" class="alert-banner-close" aria-label="Close notification">&times;</button>
                </div>
                <div class="form-actions">
                    <a href="/" class="btn-cancel">Cancel</a>
                    <button type="submit" class="btn-signin">Sign In</button>
                </div>
            </form>
            <div class="back-link">
                <a href="/">Back to Home</a>
            </div>
        </div>
    </div>

    <script>
        (function() {
            var input = document.getElementById('adminPass');
            var toggle = document.getElementById('adminPassToggle');
            if (!input || !toggle) return;
            toggle.addEventListener('click', function() {
                var show = input.type === 'password';
                input.type = show ? 'text' : 'password';
                toggle.classList.toggle('is-visible', show);
                toggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
                toggle.setAttribute('aria-pressed', show ? 'true' : 'false');
            });
        })();

        function showBannerError(el, message) {
            if (!el) return;
            var textEl = el.querySelector('.alert-banner-text');
            if (textEl) textEl.textContent = message;
            else el.textContent = message;
            el.style.display = 'flex';
        }

        function submitAdminLogin(e) {
            e.preventDefault();
            const form = e.target;
            const data = new FormData(form);
            fetch('/admin/login', {
                method: 'POST',
                body: data,
                headers: { 'X-Requested-With': 'XMLHttpRequest' }
            })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    globalThis.location.href = data.redirect || '/admin';
                } else {
                    showBannerError(document.getElementById('loginError'), data.error || 'Invalid credentials');
                }
            })
            .catch(() => {
                showBannerError(document.getElementById('loginError'), 'An error occurred');
            });
        }

        document.addEventListener('click', function(e) {
            var btn = e.target.closest('.alert-banner-close');
            if (!btn) return;
            var banner = btn.closest('.alert-dismissible');
            if (!banner) return;
            if (banner.id === 'loginError') {
                banner.style.display = 'none';
                return;
            }
            banner.remove();
        });
    </script>
</body>
</html>
