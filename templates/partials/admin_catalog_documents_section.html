<section class="form-card">
    <div class="form-card-head form-card-head--with-actions">
        <div>
            <h2>Documents</h2>
            <p>{{ documents_blurb }}</p>
        </div>
        <button type="button"
                class="btn-catalog-index"
                id="catalogIndexBtn"
                {% if not is_edit %}disabled title="Save the product before indexing"{% elif not catalog_files %}disabled title="Add and save documents before indexing"{% endif %}>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <ellipse cx="12" cy="5" rx="9" ry="3"/>
                <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/>
                <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
            </svg>
            Index for RAG
        </button>
    </div>
    <div class="form-card-body">
        <p class="catalog-rag-hint">Documents indexed here are used by the RAG search system.</p>
        {% include 'partials/admin_catalog_files.html' %}
    </div>
</section>
