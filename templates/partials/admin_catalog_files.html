<div class="catalog-files" id="catalogFiles">
    <input type="file"
           id="catalogFileInput"
           name="catalog_documents[]"
           multiple
           accept=".txt,.csv,.md,text/plain,text/csv,text/markdown"
           class="catalog-file-input"
           hidden>
    <button type="button" class="catalog-file-drop" id="catalogFileDrop" aria-label="Add document files">
        <div class="catalog-file-drop-inner">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
                <line x1="12" y1="18" x2="12" y2="12"/>
                <line x1="9" y1="15" x2="15" y2="15"/>
            </svg>
            <span class="catalog-file-drop-title">Drag and drop text files here</span>
            <span class="catalog-file-drop-hint">or click to browse · .txt, .csv, .md only</span>
        </div>
    </button>
    <ul class="catalog-file-list{% if not catalog_files %} catalog-file-list--empty{% endif %}" id="catalogFileList">
        {% for f in catalog_files or [] %}
        <li class="catalog-file-item catalog-file-item--saved" data-file-id="{{ f.id }}">
            <span class="catalog-file-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                </svg>
            </span>
            <div class="catalog-file-meta">
                <a href="{{ url_for('serve_catalog_file', id=f.id) }}" class="catalog-file-name">{{ f.file_name }}</a>
                <span class="catalog-file-size">{{ f.file_size | filesizeformat }}</span>
            </div>
            <button type="button"
                    class="catalog-file-remove"
                    data-existing-id="{{ f.id }}"
                    data-delete-url="{{ url_for('admin_delete_catalog_file', id=f.id) }}"
                    aria-label="Remove {{ f.file_name }}">Remove</button>
        </li>
        {% endfor %}
    </ul>
    <div id="catalogFileDeleteInputs" hidden></div>
</div>
