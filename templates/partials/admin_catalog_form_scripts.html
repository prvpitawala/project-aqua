<script>
document.addEventListener('DOMContentLoaded', function() {
    [1, 2, 3].forEach(function(slot) {
        var inp = document.getElementById('img' + slot);
        var prev = document.getElementById('preview' + slot);
        if (!inp || !prev) return;
        inp.addEventListener('change', function() {
            var f = this.files[0];
            if (!f || !f.type.startsWith('image/')) return;
            prev.innerHTML = '<img src="' + URL.createObjectURL(f) + '" alt="Preview"><span class="image-preview-label">New</span>';
        });
    });

    var indexBtn = document.getElementById('catalogIndexBtn');
    var ragStatus = document.getElementById('catalogRagStatus');
    var ragHint = document.getElementById('catalogRagHint');
    var fileList = document.getElementById('catalogFileList');
    var indexingOverlay = document.getElementById('catalogSaveIndexingOverlay');

    function hasSavedCatalogFiles() {
        return !!(fileList && fileList.querySelector('.catalog-file-item--saved:not([hidden])'));
    }

    function hasPendingCatalogFiles() {
        return !!(fileList && fileList.querySelector('.catalog-file-item--pending:not([hidden])'));
    }

    function updateIndexButtonState() {
        if (!indexBtn) return;
        var canIndex = !!(indexBtn.dataset.productType && indexBtn.dataset.productId && hasSavedCatalogFiles());
        indexBtn.disabled = !canIndex;
        if (!indexBtn.dataset.productType || !indexBtn.dataset.productId) {
            indexBtn.title = 'Save the product first, then you can index documents';
        } else if (hasPendingCatalogFiles() && !hasSavedCatalogFiles()) {
            indexBtn.title = 'Click Save Changes — documents are indexed automatically on save';
        } else if (!hasSavedCatalogFiles()) {
            indexBtn.title = 'Add a document and click Save Changes';
        } else {
            indexBtn.title = 'Re-index saved documents (indexing also runs automatically on save)';
        }
        if (ragHint) {
            if (hasPendingCatalogFiles() && !hasSavedCatalogFiles()) {
                ragHint.innerHTML = 'Your file will be saved and indexed when you click <strong>Save Changes</strong>.';
            } else {
                ragHint.innerHTML = 'Upload plain-text files (.txt, .csv, .md) and click <strong>Save Changes</strong> — documents are saved and indexed automatically.';
            }
        }
    }

    function documentsWillChangeOnSave() {
        return hasPendingCatalogFiles();
    }

    function showSavingIndexingNotice(catalogForm) {
        if (indexingOverlay) {
            indexingOverlay.hidden = false;
            indexingOverlay.setAttribute('aria-hidden', 'false');
        }
        if (ragStatus) {
            ragStatus.className = 'catalog-rag-status is-indexing';
            ragStatus.textContent = 'Saving and indexing documents…';
        }
        if (catalogForm) {
            var saveBtn = catalogForm.querySelector('.btn-form-primary');
            if (saveBtn) saveBtn.disabled = true;
        }
    }

    if (indexBtn && ragStatus) {
        updateIndexButtonState();
        indexBtn.addEventListener('click', function() {
            var productType = indexBtn.dataset.productType;
            var productId = indexBtn.dataset.productId;
            var indexUrl = indexBtn.dataset.indexUrl;
            if (!productType || !productId || !indexUrl) return;

            indexBtn.disabled = true;
            ragStatus.className = 'catalog-rag-status is-indexing';
            ragStatus.textContent = 'Indexing documents...';

            fetch(indexUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Requested-With': 'XMLHttpRequest',
                },
                body: JSON.stringify({
                    product_type: productType,
                    product_id: parseInt(productId, 10),
                }),
            })
            .then(function(r) { return r.json().then(function(data) { return { ok: r.ok, data: data }; }); })
            .then(function(result) {
                if (result.ok && result.data.success) {
                    ragStatus.className = 'catalog-rag-status is-success';
                    var count = result.data.chunk_count || 0;
                    ragStatus.textContent = 'Indexed ' + count + ' chunk' + (count === 1 ? '' : 's') + '.';
                } else {
                    ragStatus.className = 'catalog-rag-status is-error';
                    ragStatus.textContent = (result.data && result.data.error) || 'Indexing failed.';
                }
            })
            .catch(function() {
                ragStatus.className = 'catalog-rag-status is-error';
                ragStatus.textContent = 'Indexing failed. Please try again.';
            })
            .finally(function() {
                updateIndexButtonState();
            });
        });
    }

    var fileInput = document.getElementById('catalogFileInput');
    var fileDrop = document.getElementById('catalogFileDrop');
    var catalogForm = fileInput ? fileInput.closest('form') : null;
    if (!fileInput || !fileDrop || !fileList || !catalogForm) return;

    var pendingFiles = [];
    var allowedExt = ['.txt', '.csv', '.md'];

    function isAllowedFile(file) {
        if (!file || !file.name) return false;
        var name = file.name.toLowerCase();
        for (var i = 0; i < allowedExt.length; i++) {
            if (name.endsWith(allowedExt[i])) return true;
        }
        if (file.type && file.type.indexOf('text/') === 0) return true;
        return false;
    }

    function formatSize(bytes) {
        if (!bytes) return '0 B';
        var units = ['B', 'KB', 'MB', 'GB'];
        var i = 0;
        var size = bytes;
        while (size >= 1024 && i < units.length - 1) {
            size /= 1024;
            i++;
        }
        return (i === 0 ? size : size.toFixed(1)) + ' ' + units[i];
    }

    function syncFileInput() {
        var dt = new DataTransfer();
        pendingFiles.forEach(function(file) { dt.items.add(file); });
        fileInput.files = dt.files;
    }

    function updateListVisibility() {
        var hasItems = fileList.querySelectorAll('.catalog-file-item:not([hidden])').length > 0;
        fileList.classList.toggle('catalog-file-list--empty', !hasItems);
    }

    function addPendingFile(file) {
        if (!isAllowedFile(file)) return;
        var key = file.name + ':' + file.size + ':' + file.lastModified;
        var exists = pendingFiles.some(function(f) {
            return (f.name + ':' + f.size + ':' + f.lastModified) === key;
        });
        if (exists) return;

        pendingFiles.push(file);
        syncFileInput();

        var li = document.createElement('li');
        li.className = 'catalog-file-item catalog-file-item--pending';
        li.dataset.pendingKey = key;
        li.innerHTML =
            '<span class="catalog-file-icon" aria-hidden="true">' +
                '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' +
                    '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>' +
                    '<polyline points="14 2 14 8 20 8"/>' +
                '</svg>' +
            '</span>' +
            '<div class="catalog-file-meta">' +
                '<span class="catalog-file-name">' + file.name + '</span>' +
                '<span class="catalog-file-size">' + formatSize(file.size) + ' · New</span>' +
            '</div>' +
            '<button type="button" class="catalog-file-remove" aria-label="Remove ' + file.name + '">Remove</button>';
        fileList.appendChild(li);
        updateListVisibility();
        updateIndexButtonState();
    }

    function addPendingFiles(fileListLike) {
        Array.prototype.forEach.call(fileListLike || [], function(file) {
            addPendingFile(file);
        });
    }

    fileDrop.addEventListener('click', function() { fileInput.click(); });
    fileDrop.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            fileInput.click();
        }
    });

    fileInput.addEventListener('change', function() {
        addPendingFiles(this.files);
        syncFileInput();
    });

    ['dragenter', 'dragover'].forEach(function(evt) {
        fileDrop.addEventListener(evt, function(e) {
            e.preventDefault();
            e.stopPropagation();
            fileDrop.classList.add('catalog-file-drop--active');
        });
    });
    ['dragleave', 'drop'].forEach(function(evt) {
        fileDrop.addEventListener(evt, function(e) {
            e.preventDefault();
            e.stopPropagation();
            fileDrop.classList.remove('catalog-file-drop--active');
        });
    });
    fileDrop.addEventListener('drop', function(e) {
        addPendingFiles(e.dataTransfer && e.dataTransfer.files);
        syncFileInput();
    });

    function updateRagStatusFromIndexResult(chunkCount, warning) {
        if (!ragStatus) return;
        if (warning) {
            ragStatus.className = 'catalog-rag-status is-error';
            ragStatus.textContent = warning;
            return;
        }
        if (!chunkCount) {
            ragStatus.className = 'catalog-rag-status';
            ragStatus.textContent = 'Not indexed yet.';
            return;
        }
        ragStatus.className = 'catalog-rag-status is-success';
        var count = chunkCount || 0;
        ragStatus.textContent = 'Indexed ' + count + ' chunk' + (count === 1 ? '' : 's') + '.';
    }

    fileList.addEventListener('click', function(e) {
        var btn = e.target.closest('.catalog-file-remove');
        if (!btn) return;

        var deleteUrl = btn.getAttribute('data-delete-url');
        if (deleteUrl) {
            e.preventDefault();
            var li = btn.closest('.catalog-file-item');
            if (!li || li.classList.contains('catalog-file-item--removing')) return;

            btn.disabled = true;
            li.classList.add('catalog-file-item--removing');
            if (ragStatus) {
                ragStatus.className = 'catalog-rag-status is-indexing';
                ragStatus.textContent = 'Deleting and updating index…';
            }

            fetch(deleteUrl, {
                method: 'POST',
                headers: { 'X-Requested-With': 'XMLHttpRequest' },
            })
            .then(function(r) { return r.json().then(function(data) { return { ok: r.ok, data: data }; }); })
            .then(function(result) {
                if (result.ok && result.data.success) {
                    li.remove();
                    updateListVisibility();
                    updateRagStatusFromIndexResult(result.data.chunk_count, result.data.warning);
                    updateIndexButtonState();
                    return;
                }
                li.classList.remove('catalog-file-item--removing');
                btn.disabled = false;
                if (ragStatus) {
                    ragStatus.className = 'catalog-rag-status is-error';
                    ragStatus.textContent = (result.data && result.data.error) || 'Could not delete file.';
                }
            })
            .catch(function() {
                li.classList.remove('catalog-file-item--removing');
                btn.disabled = false;
                if (ragStatus) {
                    ragStatus.className = 'catalog-rag-status is-error';
                    ragStatus.textContent = 'Could not delete file. Please try again.';
                }
            });
            return;
        }

        var pendingItem = btn.closest('.catalog-file-item--pending');
        if (!pendingItem) return;
        var pendingKey = pendingItem.dataset.pendingKey;
        pendingFiles = pendingFiles.filter(function(f) {
            return (f.name + ':' + f.size + ':' + f.lastModified) !== pendingKey;
        });
        pendingItem.remove();
        syncFileInput();
        updateListVisibility();
        updateIndexButtonState();
    });

    catalogForm.addEventListener('submit', function() {
        syncFileInput();
        if (documentsWillChangeOnSave()) {
            showSavingIndexingNotice(catalogForm);
        }
    });
});

function handleImageDrop(e, slot) {
    e.preventDefault();
    var f = e.dataTransfer && e.dataTransfer.files[0];
    if (!f || !f.type.startsWith('image/')) return;
    var inp = document.getElementById('img' + slot);
    var prev = document.getElementById('preview' + slot);
    if (inp && prev) {
        var dt = new DataTransfer();
        dt.items.add(f);
        inp.files = dt.files;
        prev.innerHTML = '<img src="' + URL.createObjectURL(f) + '" alt="Preview"><span class="image-preview-label">New</span>';
    }
}
</script>
